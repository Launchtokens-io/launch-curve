[package]
name = "launch_curve_lean"
version = "0.1.0"
description = "launchtokens.io bonding-curve launches on Solana: the launch_curve program without Anchor (same interface), for a size comparison"
edition = "2021"
rust-version = "1.79"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "launch_curve_lean"

[features]
# devnet DEX addresses (also the local validator, which clones devnet); mainnet otherwise. Same switch as launch_curve.
devnet = []
no-entrypoint = []

[dependencies]
# no_std, zero-copy entrypoint and CPI; nothing else at runtime (pinocchio-pubkey only decodes base58 at compile time)
pinocchio = "=0.9.2"
pinocchio-pubkey = "=0.3.0"

# Own workspace (excluded from solana/Cargo.toml), so the Anchor program's lockfile and build stay untouched.
[workspace]

# Same size-optimised profile as solana/Cargo.toml.
[profile.release]
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
